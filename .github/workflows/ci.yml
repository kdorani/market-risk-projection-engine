name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pyspark: "3.5.*"
          - python: "3.12"
            pyspark: "4.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pyspark==${{ matrix.pyspark }}" -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -m "not spark" -q
      - name: Spark end-to-end tests
        run: pytest -m spark -q
      - name: Sample data is reproducible
        run: |
          python scripts/generate_sample_data.py
          git diff --exit-code data/source
